syntax = "proto3";

package ime.gateway.v1;

option cc_enable_arenas = true;

service ImeGateway {
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  rpc SendKeyEvent(SendKeyEventRequest) returns (SendKeyEventResponse);
  rpc QueryCandidates(QueryCandidatesRequest) returns (QueryCandidatesResponse);
  rpc CommitSelection(CommitSelectionRequest) returns (CommitSelectionResponse);
  rpc ResetSession(ResetSessionRequest) returns (ResetSessionResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc Ping(PingRequest) returns (PingResponse);
}

message KeyEvent {
  uint64 seq = 1;
  bool key_down = 2;
  uint32 virtual_key = 3;
  uint32 scan_code = 4;
  bool shift = 5;
  bool ctrl = 6;
  bool alt = 7;
  bool repeated = 8;
  bool extended = 9;
  int64 timestamp_ms = 10;
  uint32 source_keycode = 11;
  uint32 source_modifier = 12;
}

message CandidateItem {
  uint32 index = 1;
  string text = 2;
  string comment = 3;
  double quality = 4;
}

message OpenSessionRequest {
  string frontend_id = 1;
  string schema_id = 2;
  bool want_prewarmed_worker = 3;
}

message OpenSessionResponse {
  string session_id = 1;
  string worker_id = 2;
  uint64 backend_state_version = 3;
  uint32 idle_workers_after_assign = 4;
}

message SendKeyEventRequest {
  string session_id = 1;
  KeyEvent key_event = 2;
}

message SendKeyEventResponse {
  string session_id = 1;
  uint64 acknowledged_seq = 2;
  uint64 backend_state_version = 3;
  string composition = 4;
  string error_code = 5;
  string error_message = 6;
}

message QueryCandidatesRequest {
  string session_id = 1;
  uint64 seq = 2;
  string input_snapshot = 3;
  uint32 max_candidates = 4;
}

message QueryCandidatesResponse {
  string session_id = 1;
  uint64 backend_state_version = 2;
  string composition = 3;
  string reading = 4;
  repeated CandidateItem candidates = 5;
  uint32 selected_index = 6;
  uint32 page_size = 7;
  string error_code = 8;
  string error_message = 9;
}

message CommitSelectionRequest {
  string session_id = 1;
  uint64 seq = 2;
  uint32 candidate_index = 3;
  string committed_text = 4;
}

message CommitSelectionResponse {
  string session_id = 1;
  uint64 backend_state_version = 2;
  string committed_text = 3;
  string error_code = 4;
  string error_message = 5;
}

message ResetSessionRequest {
  string session_id = 1;
  string reason = 2;
}

message ResetSessionResponse {
  string session_id = 1;
  uint64 backend_state_version = 2;
  bool ok = 3;
  string error_code = 4;
  string error_message = 5;
}

message GetStatusRequest {
  string session_id = 1;
}

message GetStatusResponse {
  bool ok = 1;
  uint32 active_sessions = 2;
  uint32 idle_workers = 3;
  uint32 busy_workers = 4;
  string message = 5;
}

message PingRequest {
  string payload = 1;
}

message PingResponse {
  string payload = 1;
  int64 server_unix_ms = 2;
}